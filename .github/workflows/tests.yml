name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mono installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mono-mcs libmono-system-runtime-serialization4.0-cil
      - name: Tests ausführen
        run: Tests/run_tests.sh
